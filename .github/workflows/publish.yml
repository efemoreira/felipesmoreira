name: Generate a build and push to another branch

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push
    steps:
      - name: git-checkout
        uses: actions/checkout@v3

      - name: Install all dependencies
        run: npm install

      # Os testes rodam ANTES do build, e o build não acontece se eles falharem.
      # São contratos entre o Next e o PHP (`testes/contrato/`) e o smoke test
      # do painel (`testes/fumaca/`) — ver testes/LEIA-ME.md. Precisam do PHP,
      # que o runner do GitHub já traz.
      - name: Testes
        run: npm test

      - name: Build
        run: npm run build # The build command of your project

      - name: Semente do painel (preenche /painel no primeiro acesso)
        run: cp src/data/programacao.json out/dados-semente.json

      # Lista canônica das funções da militância. O formulário (Next) importa no
      # build; o PHP lê este arquivo para validar o que chega e sugerir as áreas
      # na aprovação — uma fonte só, sem lista repetida em duas linguagens.
      - name: Catálogo de funções (usado pelo painel PHP)
        run: cp src/data/funcoes.json out/funcoes.json

      # Os 184 municípios do Ceará, pelo mesmo motivo e pela mesma mecânica: o
      # formulário público importa no build, o painel lê o arquivo copiado. Duas
      # listas de cidade seriam duas grafias da mesma cidade no relatório.
      - name: Municípios do Ceará (usado pelo painel PHP)
        run: cp src/data/municipios-ce.json out/municipios-ce.json

      - name: Criar .htaccess (SPA + SEO headers)
        run: |
          cat > out/.htaccess <<'HTACCESS'
          # Sem barra automática no fim: uma rota como /propostas tem o arquivo
          # propostas.html E a pasta propostas/ (que guarda o opengraph-image). Com o
          # DirectorySlash ligado, o mod_dir devolve 301 para /propostas/ antes de a
          # página ser servida — e /propostas/ não tem índice, então dá 404.
          # Listagem de pasta nunca é desejada aqui, então desligar é seguro; o
          # -Indexes garante 403 em vez de listar se alguma escapar.
          DirectorySlash Off
          Options -Indexes
          RewriteEngine On
          RewriteBase /
          # Página 404 customizada
          ErrorDocument 404 /404.html
          # Arquivo que existe, serve direto. Pasta NÃO entra aqui de propósito —
          # ver a regra do .html mais abaixo.
          RewriteCond %{REQUEST_FILENAME} -f
          RewriteRule ^ - [L]
          # Painel: as URLs limpas caem no PHP, que confere a sessão. O estúdio é
          # o único cujo HTML existe no build — e ele nunca é servido cru.
          RewriteRule ^painel/estudio/?$ /painel/estudio.php [L]
          RewriteRule ^painel/agenda/?$ /painel/agenda.php [L]
          RewriteRule ^painel/aulas/?$ /painel/aulas.php [L]
          RewriteRule ^painel/fatos/?$ /painel/fatos.php [L]
          RewriteRule ^painel/producao/?$ /painel/producao.php [L]
          RewriteRule ^painel/municao/?$ /painel/municao.php [L]
          RewriteRule ^painel/eventos/?$ /painel/eventos.php [L]
          RewriteRule ^painel/inscricoes/?$ /painel/inscricoes.php [L]
          RewriteRule ^painel/candidatos/?$ /painel/candidatos.php [L]
          RewriteRule ^painel/pessoas/?$ /painel/pessoas.php [L]
          RewriteRule ^painel/procurar/?$ /painel/procurar.php [L]
          RewriteRule ^painel/conta/?$ /painel/conta.php [L]
          RewriteRule ^painel/manutencao/?$ /painel/manutencao.php [L]
          # ===== Prévia do link de presença (WhatsApp, Telegram, Facebook…) =====
          # O site é estático: existe UM presenca.html para todos os encontros, e
          # qual encontro é sai do ?e=/?c= — que só o JavaScript lê. O robô que
          # monta o cartão do link não roda JavaScript, então lia as meta tags do
          # layout raiz e a mensagem saía anunciando a candidatura no lugar do
          # encontro. O PHP responde o cartão certo, com o dia e o nome.
          #
          # SÓ O ROBÔ DESVIA. A pessoa que abre o link no celular continua
          # recebendo o arquivo estático, byte a byte igual ao de hoje: a fila da
          # porta do encontro não pode passar a depender do PHP estar de pé.
          RewriteCond %{QUERY_STRING} (^|&)[ec]=[a-f0-9]
          RewriteCond %{HTTP_USER_AGENT} (WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|Discordbot|LinkedInBot|SkypeUriPreview|redditbot|Applebot|Pinterest|vkShare|Iframely|Embedly|Bluesky|Mastodon|SignalR|Googlebot|bingbot) [NC]
          RewriteRule ^presenca/?$ /painel/api/presenca-previa.php [L,QSA]
          # Rotas antigas, com hífen. Elas estão no sitemap e circulam em link de
          # WhatsApp: sem o 301 elas cairiam no fallback lá embaixo e devolveriam
          # a HOME com status 200 — um soft 404, que para buscador é pior que o
          # 404 honesto.
          #
          # O QSA é o que quebra em silêncio se faltar: /quero-ajudar?funcao=
          # olheiro&de=joao-silva tem que chegar do outro lado com os dois
          # parâmetros, senão o formulário abre em branco e o crédito de quem
          # trouxe a pessoa se perde.
          RewriteRule ^quero-ajudar/?$    /queroajudar   [R=301,L,QSA]
          RewriteRule ^a-missao/?$        /amissao       [R=301,L,QSA]
          RewriteRule ^herois-do-ceara/?$ /heroisdoceara [R=301,L,QSA]
          # O kit virou Munição, e o nome mudou nos dois lados. O link antigo
          # circula em grupo de WhatsApp desde antes — ele continua chegando.
          RewriteRule ^kit/?$             /municao       [R=301,L,QSA]
          # /rota -> /rota.html, e o .html GANHA de uma pasta de mesmo nome.
          #
          # Isto não é detalhe: rota com imagem de compartilhamento própria
          # (app/propostas/opengraph-image.tsx) faz o Next gerar TANTO o
          # propostas.html QUANTO a pasta propostas/. Se a pasta ganhasse, o mod_dir
          # redirecionaria /propostas para /propostas/ — que não tem índice — e a
          # página caía em 404. Por isso a condição lá em cima só olha -f, e a de
          # pasta vem depois desta regra.
          RewriteCond %{REQUEST_FILENAME}.html -f
          RewriteRule ^(.+?)/?$ $1.html [L]
          # Pasta de verdade (ex: /modelos/wasm/) serve normalmente
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          # Redireciona tudo que não existir para index.html (SPA fallback)
          RewriteRule ^ index.html [QSA,L]

          # ===== MIME correto p/ rotas de metadata do Next (sem extensão) =====
          <IfModule mod_mime.c>
            AddType application/manifest+json .webmanifest
            # recorte de fundo: sem o MIME certo o navegador recusa o wasm
            AddType application/wasm .wasm
            AddType application/octet-stream .tflite
          </IfModule>
          <FilesMatch "^(opengraph-image|twitter-image|apple-icon|icon)$">
            ForceType image/png
          </FilesMatch>

          # ===== Headers de segurança =====
          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
            Header always set X-DNS-Prefetch-Control "on"
          </IfModule>

          # ===== Compressão (GZIP) =====
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/javascript application/json image/svg+xml
          </IfModule>

          # ===== Cache de estáticos =====
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/webp "access plus 1 day"
            ExpiresByType image/svg+xml "access plus 1 year"
            ExpiresByType image/x-icon "access plus 1 day"
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType font/woff2 "access plus 1 year"
            ExpiresByType application/xml "access plus 1 day"
            ExpiresByType text/plain "access plus 1 day"
          </IfModule>

          # ===== Cache: imutável só para quem tem hash no nome =====
          # O <FilesMatch> casa pelo NOME do arquivo, em qualquer pasta. A regra
          # antiga dizia "assets versionados do Next" no comentário mas valia
          # para a raiz também — e /favicon.ico não tem hash. Resultado: quem
          # visitou o site com o ícone antigo continuava vendo o antigo por um
          # ANO, porque `immutable` proíbe o navegador de revalidar, inclusive
          # na recarga forçada.
          #
          # Imutável agora é só onde o nome muda quando o conteúdo muda:
          #   /_next/static/  — o Next põe hash em tudo
          #   /modelos/       — wasm e modelo do recorte, 28 MB de terceiros
          #                     que nunca mudam sozinhos
          # O resto (favicon, ícones, /image) fica com um dia: troca aparece
          # rápido e ainda assim não é baixado a cada visita.
          <IfModule mod_setenvif.c>
            SetEnvIf Request_URI "^/_next/static/" COM_HASH
            SetEnvIf Request_URI "^/modelos/"      COM_HASH
          </IfModule>
          <IfModule mod_headers.c>
            <FilesMatch "\.(?:js|css|woff2|png|jpg|jpeg|webp|svg|ico|wasm|tflite)$">
              Header set Cache-Control "public, max-age=31536000, immutable" env=COM_HASH
              Header set Cache-Control "public, max-age=86400" env=!COM_HASH
            </FilesMatch>
          </IfModule>

          # ===== HTML: guarda, mas confere sempre =====
          # Sem isto o HTML sai SEM Cache-Control nenhum, e o navegador aplica cache
          # heurístico por conta própria (costuma ser 10% do tempo desde o
          # Last-Modified). Numa campanha que publica atualização, isso serve a
          # versão de ontem sem que ninguém peça.
          #
          # `no-cache` NÃO é `no-store`: o navegador pode guardar a cópia, só é
          # obrigado a conferir antes de usar. Como o Apache já manda ETag e
          # Last-Modified, a conferência volta 304 sem corpo — barato e sempre atual.
          #
          # Os metadados sem extensão (opengraph-image e companhia) caíam no
          # `ExpiresByType image/png` e ganhavam UM ANO. A URL no HTML leva hash, mas
          # um acesso direto guardaria o cartão velho pelo mesmo ano do favicon.
          <IfModule mod_headers.c>
            <FilesMatch "\.html$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
            <FilesMatch "^(opengraph-image|twitter-image)$">
              Header set Cache-Control "public, max-age=86400"
            </FilesMatch>
            <FilesMatch "\.webmanifest$">
              Header set Cache-Control "public, max-age=86400"
            </FilesMatch>
          </IfModule>
          HTACCESS

      - name: Trancar o HTML do estúdio (só o estudio.php serve a página)
        run: |
          cat > out/painel/.htaccess <<'HTACCESS'
          Options -Indexes
          # o HTML do Next e o payload que o acompanha só saem pelo estudio.php
          <FilesMatch "^estudio\.(html|txt)$">
            <IfModule mod_authz_core.c>
              Require all denied
            </IfModule>
            <IfModule !mod_authz_core.c>
              Order allow,deny
              Deny from all
            </IfModule>
          </FilesMatch>
          HTACCESS

      - name: Push
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: build # The branch name where you want to push the assets
          FOLDER: out # The directory where your assets are generated
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub will automatically add this - you don't need to bother getting a token
          MESSAGE: "Build: ({sha}) {msg}" # The commit message
