name: Generate a build and push to another branch

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push
    steps:
      - name: git-checkout
        uses: actions/checkout@v3

      - name: Install all dependencies
        run: npm install

      - name: Build
        run: npm run build # The build command of your project

      - name: Semente do painel (preenche /painel no primeiro acesso)
        run: cp src/data/programacao.json out/dados-semente.json

      - name: Criar .htaccess (SPA + SEO headers)
        run: |
          cat > out/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteBase /
          # Página 404 customizada
          ErrorDocument 404 /404.html
          # Se o arquivo ou diretório existe, serve normalmente
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          # Estúdio de artes: a URL limpa cai no porteiro PHP, nunca no HTML cru
          RewriteRule ^painel/estudio/?$ /painel/estudio.php [L]
          # Redireciona /rota para /rota.html
          RewriteRule ^([^/]+)$ $1.html [L]
          # Redireciona tudo que não existir para index.html (SPA fallback)
          RewriteRule ^ index.html [QSA,L]

          # ===== MIME correto p/ rotas de metadata do Next (sem extensão) =====
          <IfModule mod_mime.c>
            AddType application/manifest+json .webmanifest
            # recorte de fundo: sem o MIME certo o navegador recusa o wasm
            AddType application/wasm .wasm
            AddType application/octet-stream .tflite
          </IfModule>
          <FilesMatch "^(opengraph-image|twitter-image|apple-icon|icon)$">
            ForceType image/png
          </FilesMatch>

          # ===== Headers de segurança =====
          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
            Header always set X-DNS-Prefetch-Control "on"
          </IfModule>

          # ===== Compressão (GZIP) =====
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/javascript application/json image/svg+xml
          </IfModule>

          # ===== Cache de estáticos =====
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
            ExpiresByType image/x-icon "access plus 1 year"
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType font/woff2 "access plus 1 year"
            ExpiresByType application/xml "access plus 1 day"
            ExpiresByType text/plain "access plus 1 day"
          </IfModule>

          # Assets versionados do Next (_next/static) — imutáveis
          <IfModule mod_headers.c>
            <FilesMatch "\.(?:js|css|woff2|png|jpg|jpeg|svg|ico|wasm|tflite)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          HTACCESS

      - name: Trancar o HTML do estúdio (só o estudio.php serve a página)
        run: |
          cat > out/painel/.htaccess <<'HTACCESS'
          Options -Indexes
          # o HTML do Next e o payload que o acompanha só saem pelo estudio.php
          <FilesMatch "^estudio\.(html|txt)$">
            <IfModule mod_authz_core.c>
              Require all denied
            </IfModule>
            <IfModule !mod_authz_core.c>
              Order allow,deny
              Deny from all
            </IfModule>
          </FilesMatch>
          HTACCESS

      - name: Push
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: build # The branch name where you want to push the assets
          FOLDER: out # The directory where your assets are generated
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub will automatically add this - you don't need to bother getting a token
          MESSAGE: "Build: ({sha}) {msg}" # The commit message
