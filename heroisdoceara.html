ato a Vice-Governador do Ceará","description":"De militante de internet no MBL Ceará a militante de rua. Ex-líder de jovens que abraçou a Missão Ceará para devolver aos jovens a liberdade tomada pelo crime organizado. Candidato a Vice-Governador do Ceará.","telephone":"+55 85 98187-2972","areaServed":"BR","homeLocation":{"@type":"AdministrativeArea","name":"Ceará"},"affiliation":{"@type":"Organization","name":"Movimento Brasil Livre","alternateName":"MBL"},"contactPoint":{"@type":"ContactPoint","telephone":"+55 85 98187-2972","contactType":"Customer Support","areaServed":"BR","availableLanguage":["pt-BR"]}}</script><title>Heróis do Ceará | Felipe Moreira</title><meta name="description" content="Cordel dos que fizeram nossa história: conheça os heróis históricos do Ceará, suas histórias, legados e impactos na formação cultural do estado."/><meta name="application-name" content="Felipe Moreira"/><meta name="author" content="Felipe Moreira"/><link rel="manifest" href="/manifest.webmanifest"/><meta name="keywords" content="Felipe Moreira,Ceará,Missão,Missão CE,Missão Ceará,MBL,MBL CE,MBL Ceará,candidato a vice-governador do Ceará,vice-governador do Ceará,eleições 2026 Ceará,segurança pública Ceará,sertão,heróis do Ceará,cordel,política,ativista"/><meta name="creator" content="Felipe Moreira"/><meta name="publisher" content="Felipe Moreira"/><meta name="robots" content="index, follow"/><meta name="googlebot" content="index, follow, max-video-preview:-1, max-image-preview:large, max-snippet:-1"/><link rel="canonical" href="https://felipesmoreira.com/heroisdoceara"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta property="og:title" content="Heróis do Ceará — Missão Ceará"/><meta property="og:description" content="Cordel dos que fizeram nossa história: da fundação do Ceará à cultura que o mundo conhece."/><meta name="twitter:card" content="summary_large_image"/><meta name="twitter:site" content="@moreiramissao"/><meta name="twitter:creator" content="@moreiramissao"/><meta name="twitter:title" content="Felipe Moreira — Candidato a Vice-Governador do Ceará"/><meta name="twitter:description" content="Missão Ceará: devolver aos nossos jovens a liberdade que o crime organizado roubou."/><link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16"/><link rel="icon" href="/icon.png?4affb89d7e329e7f" type="image/png" sizes="512x512"/><link rel="apple-touch-icon" href="/apple-icon.png?a490a8ee04cd48f9" type="image/png" sizes="180x180"/><script>document.querySelectorAll('body link[rel="icon"], body link[rel="apple-touch-icon"]').forEach(el => document.head.appendChild(el))</script><script src="/_next/static/chunks/polyfills-42372ed130431b0a.js" noModule=""></script></head><body class="__variable_c29908 __variable_988a28 __variable_91eb3e __variable_e17bec antialiased"><script type="application/ld+json">{"@context":"https://schema.org","@type":"ItemList","name":"Heróis do Ceará","description":"Figuras históricas que formaram o Ceará, da fundação à cultura — com contexto, ações e legado.","numberOfItems":31,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Person","name":"Martim Soares Moreno","alternateName":"O Fundador do Ceará","birthPlace":"Santiago do Cacém, Portugal","deathPlace":"Portugal","description":"Inscrito no Livro dos Heróis da Pátria em 2015. Modelou a estratégia indigenista de integração cultural como forma de conquista. Personagem inspirador de Iracema (José de Alencar, 1865).","knowsAbout":"Militar"}},{"@type":"ListItem","position":2,"item":{"@type":"Person","name":"Jacaúna","alternateName":"O Grande Cacique Potiguara","birthPlace":"Siará Grande (litoral cearense)","deathPlace":"Siará Grande","description":"Representa os povos que moldaram o território cearense antes da colonização europeia. Sua aliança não foi rendição, mas diplomacia de sobrevivência. A perspectiva indígena da fundação do Ceará.","knowsAbout":"Indígena"}},{"@type":"ListItem","position":3,"item":{"@type":"Person","name":"Bárbara Pereira de Alencar","alternateName":"Dona Bárbara do Crato / A Primeira Presa Política do Brasil","birthPlace":"Fazenda Caiçara, Exu (PE)","deathPlace":"Fronteiras (PI)","description":"Inscrita no Livro dos Heróis e Heroínas da Pátria (Lei 13.056/2014). Considerada a primeira presa política do Brasil. Avó do maior romancista do Romantismo brasileiro.","knowsAbout":"Político/Revolucionário"}},{"@type":"ListItem","position":4,"item":{"@type":"Person","name":"Tristão Gonçalves de Alencar Araripe","alternateName":"Tristão Gonçalves / Mártir da República","birthPlace":"Crato (CE)","deathPlace":"Santa Rosa do Jaguaribe (CE)","description":"Filho da primeira presa política do Brasil, ele próprio morreu pela República. Mártir fundador do republicanismo cearense.","knowsAbout":"Político/Revolucionário"}},{"@type":"ListItem","position":5,"item":{"@type":"Person","name":"Tristão de Alencar Araripe","alternateName":"Conselheiro Araripe / O Juiz-Historiador","birthPlace":"Icó (CE)","deathPlace":"Rio de Janeiro (RJ)","description":"Filho do mártir republicano que se tornou pilar do Estado de Direito — ironia da história cearense. A obra historiográfica foi fundacional para todos os estudos posteriores.","knowsAbout":"Científico/Histórico"}},{"@type":"ListItem","position":6,"item":{"@type":"Person","name":"Tomás Pompeu de Sousa Brasil","alternateName":"Senador Pompeu / O Sábio do Ceará","birthPlace":"Santa Quitéria (CE)","deathPlace":"Fortaleza (CE)","description":"A Avenida Senador Pompeu em Fortaleza. Pioneiro absoluto na ciência climática do Nordeste. Seu Compêndio foi adotado em escolas de todo o Brasil.","knowsAbout":"Científico/Histórico"}},{"@type":"ListItem","position":7,"item":{"@type":"Person","name":"José de Alencar","alternateName":"Cazuza / Pai da Literatura Brasileira","birthPlace":"Sítio Alagadiço Novo, Mecejana/Fortaleza (CE)","deathPlace":"Rio de Janeiro (RJ)","description":"Patrono da Cadeira 23 da ABL por escolha de Machado de Assis. O Theatro José de Alencar (Fortaleza) e a Praça José de Alencar (RJ) o homenageiam. Maior romancista do Romantismo brasileiro.","knowsAbout":"Literário"}},{"@type":"ListItem","position":8,"item":{"@type":"Person","name":"Jovita Alves Feitosa","alternateName":"Joana D'Arc Brasileira","birthPlace":"Tauá (CE)","deathPlace":"Rio de Janeiro (RJ)","description":"Símbolo da luta feminista avant la lettre no Brasil. Inscrita no Panteão da Pátria. A Praça Jovita Feitosa fica em Fortaleza.","knowsAbout":"Militar"}},{"@type":"ListItem","position":9,"item":{"@type":"Person","name":"General Tibúrcio","alternateName":"Antônio Tibúrcio Ferreira de Sousa","birthPlace":"Viçosa do Ceará (CE)","deathPlace":"Fortaleza (CE)","description":"Inscrito no Livro dos Heróis da Pátria (Lei 14.610/2023). Símbolo do militar-cidadão cearense: guerreiro no Paraguai, abolicionista no sertão.","knowsAbout":"Militar"}},{"@type":"ListItem","position":10,"item":{"@type":"Person","name":"Liberato Barroso","alternateName":"José Liberato Barroso","birthPlace":"Aracati (CE)","deathPlace":"Rio de Janeiro (RJ)","description":"Patrono da Cadeira 20 da Academia Cearense de Letras. Uma das vozes políticas mais ativas na abolição cearense.","knowsAbout":"Político/Revolucionário"}},{"@type":"ListItem","position":11,"item":{"@type":"Person","name":"Maria Tomásia Figueira Lima","alternateName":"A Libertadora / A Matriarca Abolicionista","birthPlace":"Sobral (CE)","deathPlace":"Fortaleza (CE)","description":"Pioneira do feminismo abolicionista no Brasil. Rua Maria Tomásia em Fortaleza (bairro Aldeota). Símbolo de que a luta das mulheres foi central — não periférica — na abolição cearense.","knowsAbout":"Abolicionista"}},{"@type":"ListItem","position":12,"item":{"@type":"Person","name":"Dragão do Mar","alternateName":"Francisco José do Nascimento / Chico da Matilde","birthPlace":"Canoa Quebrada, Aracati (CE)","deathPlace":"Fortaleza (CE)","description":"Inscrito no Livro dos Heróis da Pátria (Lei 13.601/2017). O Centro Dragão do Mar de Arte e Cultura (Fortaleza, 1999) leva seu nome. Símbolo máximo do abolicionismo cearense e da resistência popular.","knowsAbout":"Abolicionista"}},{"@type":"ListItem","position":13,"item":{"@type":"Person","name":"João Cordeiro","alternateName":"O Presidente da Libertação","birthPlace":"Ceará","deathPlace":"Fortaleza (CE)","description":"Organizador-chefe da estrutura que tornou o Ceará o primeiro estado abolicionista. A Avenida João Cordeiro, na Praia de Iracema, homenageia sua memória.","knowsAbout":"Abolicionista"}},{"@type":"ListItem","position":14,"item":{"@type":"Person","name":"Antônio Bezerra de Menezes","alternateName":"André Carnaúba (Padaria Espiritual)","birthPlace":"Quixeramobim (CE)","deathPlace":"Fortaleza (CE)","description":"Patrono da Cadeira 4 da Academia Cearense de Letras. Sua Descrição da Cidade de Fortaleza é fonte histórica primária insubstituível para pesquisadores.","knowsAbout":"Literário"}},{"@type":"ListItem","position":15,"item":{"@type":"Person","name":"Juvenal Galeno","alternateName":"O Cantor do Povo Cearense","birthPlace":"Fortaleza (CE)","deathPlace":"Fortaleza (CE)","description":"Patrono da Cadeira 23 da Academia Cearense de Letras. Considerado por Antônio Sales 'o primeiro poeta abolicionista do Brasil'. A Casa de Juvenal Galeno, em Fortaleza, é tombada.","knowsAbout":"Literário"}},{"@type":"ListItem","position":16,"item":{"@type":"Person","name":"José Marrocos","alternateName":"O Intelectual de Juazeiro","birthPlace":"Crato (CE)","deathPlace":"Juazeiro do Norte (CE)","description":"Elo entre o abolicionismo do litoral e o messianismo do interior cearense. Primo e aliado intelectual fundamental de Padre Cícero.","knowsAbout":"Literário"}},{"@type":"ListItem","position":17,"item":{"@type":"Person","name":"Antônio Conselheiro","alternateName":"Antônio Vicente Mendes Maciel","birthPlace":"Quixeramobim (CE)","deathPlace":"Canudos (BA)","description":"Mártir da resistência sertaneja. Imortalizou-se em Os Sertões. Referência central em messianismo, movimentos sociais e identidade nordestina. Sua cabeça foi decapitada e enviada à Faculdade de Medicina da Bahia — exemplo do racismo científico do séc. XIX.","knowsAbout":"Religioso/Social"}},{"@type":"ListItem","position":18,"item":{"@type":"Person","name":"Padre Cícero Romão Batista","alternateName":"Padim Ciço","birthPlace":"Crato (CE)","deathPlace":"Juazeiro do Norte (CE)","description":"O mais venerado personagem do imaginário nordestino. Seu legado é ambivalente: deu dignidade ao sertanejo e ao mesmo tempo articulou o coronelismo conservador do sertão.","knowsAbout":"Religioso/Social"}},{"@type":"ListItem","position":19,"item":{"@type":"Person","name":"Capistrano de Abreu","alternateName":"Príncipe dos Historiadores Brasileiros","birthPlace":"Sítio Columinjuba, Maranguape (CE)","deathPlace":"Rio de Janeiro (RJ)","description":"A Biblioteca Pública Municipal de Maranguape leva seu nome. Seu método historiográfico é o paradigma da ciência histórica no Brasil. O apodo 'Príncipe dos Historiadores' é o mais justo da cultura cearense.","knowsAbout":"Científico/Histórico"}},{"@type":"ListItem","position":20,"item":{"@type":"Person","name":"Rodolfo Teófilo","alternateName":"O Farmacêutico do Povo","birthPlace":"Salvador (BA) — radicado no Ceará desde jovem","deathPlace":"Fortaleza (CE)","description":"Herói da saúde pública e pioneiro do romance nordestino. A Rua Rodolfo Teófilo, em Fortaleza, homenageia sua memória.","knowsAbout":"Científico/Histórico"}},{"@type":"ListItem","position":21,"item":{"@type":"Person","name":"Antônio Sales","alternateName":"Moacir Jurema (Padaria Espiritual)","birthPlace":"Icó (CE)","deathPlace":"Rio de Janeiro (RJ)","description":"Fundador do primeiro movimento literário modernista do Nordeste. A Padaria Espiritual é referência fundacional da literatura cearense moderna.","knowsAbout":"Literário"}},{"@type":"ListItem","position":22,"item":{"@type":"Person","name":"Gustavo Barroso","alternateName":"João do Norte","birthPlace":"Fortaleza (CE)","deathPlace":"Rio de Janeiro (RJ)","description":"Figura contraditória: genial folclorista e museólogo que construiu a memória nacional, e ao mesmo tempo propagandista fascista e antissemita. Exige contextualização crítica obrigatória.","knowsAbout":"Literário"}},{"@type":"ListItem","position":23,"item":{"@type":"Person","name":"Rachel de Queiroz","alternateName":"A Dama da Literatura Brasileira","birthPlace":"Fortaleza (CE)","deathPlace":"Rio de Janeiro (RJ)","description":"Símbolo da resistência feminina e literária. A primeira a quebrar a barreira de gênero nas mais altas instituições literárias do país.","knowsAbout":"Literário"}},{"@type":"ListItem","position":24,"item":{"@type":"Person","name":"Patativa do Assaré","alternateName":"Antônio Gonçalves da Silva / O Rouxinol dos Sertões","birthPlace":"Serra de Santana, Assaré (CE)","deathPlace":"Assaré (CE)","description":"O maior poeta popular do Brasil. Símbolo absoluto da sabedoria sertaneja que prescinde de diploma para alcançar a grandeza.","knowsAbout":"Literário"}},{"@type":"ListItem","position":25,"item":{"@type":"Person","name":"Dom Hélder Câmara","alternateName":"Bispo das Favelas / Arcebispo Vermelho","birthPlace":"Fortaleza (CE)","deathPlace":"Recife (PE)","description":"Sua frase sobre pobres e comunistas resume a contradição do poder. Símbolo mundial dos direitos humanos e da Igreja dos Pobres. Um dos maiores cearenses de todos os tempos.","knowsAbout":"Religioso/Social"}},{"@type":"ListItem","position":26,"item":{"@type":"Person","name":"Frei Tito de Alencar Lima","alternateName":"Mártir da Ditadura","birthPlace":"Fortaleza (CE)","deathPlace":"Éveux, Lyon (França)","description":"Mártir oficial da Ditadura Militar. Descendente da família Alencar — o ciclo histórico se fecha: da Bárbara de Alencar (1760) ao Frei Tito (1945), a mesma família lutou pela liberdade por dois séculos.","knowsAbout":"Religioso/Social"}},{"@type":"ListItem","position":27,"item":{"@type":"Person","name":"Belchior","alternateName":"Antônio Carlos Gomes Belchior","birthPlace":"Sobral (CE)","deathPlace":"Santa Cruz do Sul (RS)","description":"O poeta da juventude desiludida. Sua obra é referência sobre identidade, rebeldia e nordestinidade na MPB.","knowsAbout":"Musical"}},{"@type":"ListItem","position":28,"item":{"@type":"Person","name":"Fagner","alternateName":"Raimundo Fagner Cândido Lopes","birthPlace":"Orós (CE)","deathPlace":"—","description":"Um dos maiores intérpretes da MPB. Guardião da identidade musical cearense no cenário nacional por mais de cinco décadas.","knowsAbout":"Musical"}},{"@type":"ListItem","position":29,"item":{"@type":"Person","name":"Ednardo","alternateName":"José Ednardo Soares Costa Sousa","birthPlace":"Fortaleza (CE)","deathPlace":"—","description":"Fundador do movimento musical que levou a identidade cearense ao centro da MPB nacional.","knowsAbout":"Musical"}},{"@type":"ListItem","position":30,"item":{"@type":"Person","name":"Chico Anysio","alternateName":"Francisco Anysio de Oliveira Paula Filho","birthPlace":"Maranguape (CE)","deathPlace":"Rio de Janeiro (RJ)","description":"O maior comediante da história da TV brasileira. A criação de 209 personagens é recorde nacional documentado pelo RankBrasil.","knowsAbout":"Teatro/Cultural"}},{"@type":"ListItem","position":31,"item":{"@type":"Person","name":"Oswald Barroso","alternateName":"O Mestre do Teatro Popular Cearense","birthPlace":"Fortaleza (CE)","deathPlace":"Fortaleza (CE)","description":"Referência do teatro popular nordestino. Suas obras são base obrigatória dos estudos de cultura popular e afro-brasileira no Ceará.","knowsAbout":"Teatro/Cultural"}}]}</script><div style="min-height:100dvh;background:repeating-linear-gradient(88deg, rgba(24,18,3,.045) 0 2px, transparent 2px 15px),repeating-linear-gradient(-91deg, rgba(24,18,3,.03) 0 2px, transparent 2px 21px), #F3ECDA;color:#181203;font-family:var(--font-bitter), serif;color-scheme:light"><style>

rá\",\"birthPlace\":\"Santiago do Cacém, Portugal\",\"deathPlace\":\"Portugal\",\"description\":\"Inscrito no Livro dos Heróis da Pátria em 2015. Modelou a estratégia indigenista de integração cultural como forma de conquista. Personagem inspirador de Iracema (José de Alencar, 1865).\",\"knowsAbout\":\"Militar\"}},{\"@type\":\"ListItem\",\"position\":2,\"item\":{\"@type\":\"Person\",\"name\":\"Jacaúna\",\"alternateName\":\"O Grande Cacique Potiguara\",\"birthPlace\":\"Siará Grande (litoral cearense)\",\"deathPlace\":\"Siará Grande\",\"description\":\"Representa os povos que moldaram o território cearense antes da colonização europeia. Sua aliança não foi rendição, mas diplomacia de sobrevivência. A perspectiva indígena da fundação do Ceará.\",\"knowsAbout\":\"Indígena\"}},{\"@type\":\"ListItem\",\"position\":3,\"item\":{\"@type\":\"Person\",\"name\":\"Bárbara Pereira de Alencar\",\"alternateName\":\"Dona Bárbara do Crato / A Primeira Presa Política do Brasil\",\"birthPlace\":\"Fazenda Caiçara, Exu (PE)\",\"deathPlace\":\"Fronteiras (PI)\",\"description\":\"Inscrita no Livro dos Heróis e Heroínas da Pátria (Lei 13.056/2014). Considerada a primeira presa política do Brasil. Avó do maior romancista do Romantismo brasileiro.\",\"knowsAbout\":\"Político/Revolucionário\"}},{\"@type\":\"ListItem\",\"position\":4,\"item\":{\"@type\":\"Person\",\"name\":\"Tristão Gonçalves de Alencar Araripe\",\"alternateName\":\"Tristão Gonçalves / Mártir da República\",\"birthPlace\":\"Crato (CE)\",\"deathPlace\":\"Santa Rosa do Jaguaribe (CE)\",\"description\":\"Filho da primeira presa política do Brasil, ele próprio morreu pela República. Mártir fundador do republicanismo cearense.\",\"knowsAbout\":\"Político/Revolucionário\"}},{\"@type\":\"ListItem\",\"position\":5,\"item\":{\"@type\":\"Person\",\"name\":\"Tristão de Alencar Araripe\",\"alternateName\":\"Conselheiro Araripe / O Juiz-Historiador\",\"birthPlace\":\"Icó (CE)\",\"deathPlace\":\"Rio de Janeiro (RJ)\",\"description\":\"Filho do mártir republicano que se tornou pilar do Estado de Direito — ironia da história cearense. A obra historiográfica foi fundacional para todos os estudos posteriores.\",\"knowsAbout\":\"Científico/Histórico\"}},{\"@type\":\"ListItem\",\"position\":6,\"item\":{\"@type\":\"Person\",\"name\":\"Tomás Pompeu de Sousa Brasil\",\"alternateName\":\"Senador Pompeu / O Sábio do Ceará\",\"birthPlace\":\"Santa Quitéria (CE)\",\"deathPlace\":\"Fortaleza (CE)\",\"description\":\"A Avenida Senador Pompeu em Fortaleza. Pioneiro absoluto na ciência climática do Nordeste. Seu Compêndio foi adotado em escolas de todo o Brasil.\",\"knowsAbout\":\"Científico/Histórico\"}},{\"@type\":\"ListItem\",\"position\":7,\"item\":{\"@type\":\"Person\",\"name\":\"José de Alencar\",\"alternateName\":\"Cazuza / Pai da Literatura Brasileira\",\"birthPlace\":\"Sítio Alagadiço Novo, Mecejana/Fortaleza (CE)\",\"deathPlace\":\"Rio de Janeiro (RJ)\",\"description\":\"Patrono da Cadeira 23 da ABL por escolha de Machado de Assis. O Theatro José de Alencar (Fortaleza) e a Praça José de Alencar (RJ) o homenageiam. Maior romancista do Romantismo brasileiro.\",\"knowsAbout\":\"Literário\"}},{\"@type\":\"ListItem\",\"position\":8,\"item\":{\"@type\":\"Person\",\"name\":\"Jovita Alves Feitosa\",\"alternateName\":\"Joana D'Arc Brasileira\",\"birthPlace\":\"Tauá (CE)\",\"deathPlace\":\"Rio de Janeiro (RJ)\",\"description\":\"Símbolo da luta feminista avant la lettre no Brasil. Inscrita no Panteão da Pátria. A Praça Jovita Feitosa fica em Fortaleza.\",\"knowsAbout\":\"Militar\"}},{\"@type\":\"ListItem\",\"position\":9,\"item\":{\"@type\":\"Person\",\"name\":\"General Tibúrcio\",\"alternateName\":\"Antônio Tibúrcio Ferreira de Sousa\",\"birthPlace\":\"Viçosa do Ceará (CE)\",\"deathPlace\":\"Fortaleza (CE)\",\"description\":\"Inscrito no Livro dos Heróis da Pátria (Lei 14.610/2023). Símbolo do militar-cidadão cearense: guerreiro no Paraguai, abolicionista no sertão.\",\"knowsAbout\":\"Militar\"}},{\"@type\":\"ListItem\",\"position\":10,\"item\":{\"@type\":\"Person\",\"name\":\"Liberato Barroso\",\"alternateName\":\"José Liberato Barroso\",\"birthPlace\":\"Aracati (CE)\",\"deathPlace\":\"Rio de Janeiro (RJ)\",\"description\":\"Patrono da Cadeira 20 da Academia Cearense de Letras. Uma das vozes políticas mais ativas na abolição cearense.\",\"knowsAbout\":\"Político/Revolucionário\"}},{\"@type\":\"ListItem\",\"position\":11,\"item\":{\"@type\":\"Person\",\"name\":\"Maria Tomásia Figueira Lima\",\"alternateName\":\"A Libertadora / A Matriarca Abolicionista\",\"birthPlace\":\"Sobral (CE)\",\"deathPlace\":\"Fortaleza (CE)\",\"description\":\"Pioneira do feminismo abolicionista no Brasil. Rua Maria Tomásia em Fortaleza (bairro Aldeota). Símbolo de que a luta das mulheres foi central — não periférica — na abolição cearense.\",\"knowsAbout\":\"Abolicionista\"}},{\"@type\":\"ListItem\",\"position\":12,\"item\":{\"@type\":\"Person\",\"name\":\"Dragão do Mar\",\"alternateName\":\"Francisco José do Nascimento / Chico da Matilde\",\"birthPlace\":\"Canoa Quebrada, Aracati (CE)\",\"deathPlace\":\"Fortaleza (CE)\",\"description\":\"Inscrito no Livro dos Heróis da Pátria (Lei 13.601/2017). O Centro Dragão do Mar de Arte e Cultura (Fortaleza, 1999) leva seu nome. Símbolo máximo do abolicionismo cearense e da resistência popular.\",\"knowsAbout\":\"Abolicionista\"}},{\"@type\":\"ListItem\",\"position\":13,\"item\":{\"@type\":\"Person\",\"name\":\"João Cordeiro\",\"alternateName\":\"O Presidente da Libertação\",\"birthPlace\":\"Ceará\",\"deathPlace\":\"Fortaleza (CE)\",\"description\":\"Organizador-chefe da estrutura que tornou o Ceará o primeiro estado abolicionista. A Avenida João Cordeiro, na Praia de Iracema, homenageia sua memória.\",\"knowsAbout\":\"Abolicionista\"}},{\"@type\":\"ListItem\",\"position\":14,\"item\":{\"@type\":\"Person\",\"name\":\"Antônio Bezerra de Menezes\",\"alternateName\":\"André Carnaúba (Padaria Espiritual)\",\"birthPlace\":\"Quixeramobim (CE)\",\"deathPlace\":\"Fortaleza (CE)\",\"description\":\"Patrono da Cadeira 4 da Academia Cearense de Letras. Sua Descrição da Cidade de Fortaleza é fonte histórica primária insubstituível para pesquisadores.\",\"knowsAbout\":\"Literário\"}},{\"@type\":\"ListItem\",\"position\":15,\"item\":{\"@type\":\"Person\",\"name\":\"Juvenal Galeno\",\"alternateName\":\"O Cantor do Povo Cearense\",\"birthPlace\":\"Fortaleza (CE)\",\"deathPlace\":\"Fortaleza (CE)\",\"description\":\"Patrono da Cadeira 23 da Academia Cearense de Letras. Considerado por Antônio Sales 'o primeiro poeta abolicionista do Brasil'. A Casa de Juvenal Galeno, em Fortaleza, é tombada.\",\"knowsAbout\":\"Literário\"}},{\"@type\":\"ListItem\",\"position\":16,\"item\":{\"@type\":\"Person\",\"name\":\"José Marrocos\",\"alternateName\":\"O Intelectual de Juazeiro\",\"birthPlace\":\"Crato (CE)\",\"deathPlace\":\"Juazeiro do Norte (CE)\",\"description\":\"Elo entre o abolicionismo do litoral e o messianismo do interior cearense. Primo e aliado intelectual fundamental de Padre Cícero.\",\"knowsAbout\":\"Literário\"}},{\"@type\":\"ListItem\",\"position\":17,\"item\":{\"@type\":\"Person\",\"name\":\"Antônio Conselheiro\",\"alternateName\":\"Antônio Vicente Mendes Maciel\",\"birthPlace\":\"Quixeramobim (CE)\",\"deathPlace\":\"Canudos (BA)\",\"description\":\"Mártir da resistência sertaneja. Imortalizou-se em Os Sertões. Referência central em messianismo, movimentos sociais e identidade nordestina. Sua cabeça foi decapitada e enviada à Faculdade de Medicina da Bahia — exemplo do racismo científico do séc. XIX.\",\"knowsAbout\":\"Religioso/Social\"}},{\"@type\":\"ListItem\",\"position\":18,\"item\":{\"@type\":\"Person\",\"name\":\"Padre Cícero Romão Batista\",\"alternateName\":\"Padim Ciço\",\"birthPlace\":\"Crato (CE)\",\"deathPlace\":\"Juazeiro do Norte (CE)\",\"description\":\"O mais venerado personagem do imaginário nordestino. Seu legado é ambivalente: deu dignidade ao sertanejo e ao mesmo tempo articulou o coronelismo conservador do sertão.\",\"knowsAbout\":\"Religioso/Social\"}},{\"@type\":\"ListItem\",\"position\":19,\"item\":{\"@type\":\"Person\",\"name\":\"Capistrano de Abreu\",\"alternateName\":\"Príncipe dos Historiadores Brasileiros\",\"birthPlace\":\"Sítio Columinjuba, Maranguape (CE)\",\"deathPlace\":\"Rio de Janeiro (RJ)\",\"description\":\"A Biblioteca Pública Municipal de Maranguape leva seu nome. Seu método historiográfico é o paradigma da ciência histórica no Brasil. O apodo 'Príncipe dos Historiadores' é o mais justo da cultura cearense.\",\"knowsAbout\":\"Científico/Histórico\"}},{\"@type\":\"ListItem\",\"position\":20,\"item\":{\"@type\":\"Person\",\"name\":\"Rodolfo Teófilo\",\"alternateName\":\"O Farmacêutico do Povo\",\"birthPlace\":\"Salvador (BA) — radicado no Ceará desde jovem\",\"deathPlace\":\"Fortaleza (CE)\",\"description\":\"Herói da saúde pública e pioneiro do romance nordestino. A Rua Rodolfo Teófilo, em Fortaleza, homenageia sua memória.\",\"knowsAbout\":\"Científico/Histórico\"}},{\"@type\":\"ListItem\",\"position\":21,\"item\":{\"@type\":\"Person\",\"name\":\"Antônio Sales\",\"alternateName\":\"Moacir Jurema (Padaria Espiritual)\",\"birthPlace\":\"Icó (CE)\",\"deathPlace\":\"Rio de Janeiro (RJ)\",\"description\":\"Fundador do primeiro movimento literário modernista do Nordeste. A Padaria Espiritual é referência fundacional da literatura cearense moderna.\",\"knowsAbout\":\"Literário\"}},{\"@type\":\"ListItem\",\"position\":22,\"item\":{\"@type\":\"Person\",\"name\":\"Gustavo Barroso\",\"alternateName\":\"João do Norte\",\"birthPlace\":\"Fortaleza (CE)\",\"deathPlace\":\"Rio de Janeiro (RJ)\",\"description\":\"Figura contraditória: genial folclorista e museólogo que construiu a memória nacional, e ao mesmo tempo propagandista fascista e antissemita. Exige contextualização crítica obrigatória.\",\"knowsAbout\":\"Literário\"}},{\"@type\":\"ListItem\",\"position\":23,\"item\":{\"@type\":\"Person\",\"name\":\"Rachel de Queiroz\",\"alternateName\":\"A Dama da Literatura Brasileira\",\"birthPlace\":\"Fortaleza (CE)\",\"deathPlace\":\"Rio de Janeiro (RJ)\",\"description\":\"Símbolo da resistência feminina e literária. A primeira a quebrar a barreira de gênero nas mais altas instituições literárias do país.\",\"knowsAbout\":\"Literário\"}},{\"@type\":\"ListItem\",\"position\":24,\"item\":{\"@type\":\"Person\",\"name\":\"Patativa do Assaré\",\"alternateName\":\"Antônio Gonçalves da Silva / O Rouxinol dos Sertões\",\"birthPlace\":\"Serra de Santana, Assaré (CE)\",\"deathPlace\":\"Assaré (CE)\",\"description\":\"O maior poeta popular do Brasil. Símbolo absoluto da sabedoria sertaneja que prescinde de diploma para alcançar a grandeza.\",\"knowsAbout\":\"Literário\"}},{\"@type\":\"ListItem\",\"position\":25,\"item\":{\"@type\":\"Person\",\"name\":\"Dom Hélder Câmara\",\"alternateName\":\"Bispo das Favelas / Arcebispo Vermelho\",\"birthPlace\":\"Fortaleza (CE)\",\"deathPlace\":\"Recife (PE)\",\"description\":\"Sua frase sobre pobres e comunistas resume a contradição do poder. Símbolo mundial dos direitos humanos e da Igreja dos Pobres. Um dos maiores cearenses de todos os tempos.\",\"knowsAbout\":\"Religioso/Social\"}},{\"@type\":\"ListItem\",\"position\":26,\"item\":{\"@type\":\"Person\",\"name\":\"Frei Tito de Alencar Lima\",\"alternateName\":\"Mártir da Ditadura\",\"birthPlace\":\"Fortaleza (CE)\",\"deathPlace\":\"Éveux, Lyon (França)\",\"description\":\"Mártir oficial da Ditadura Militar. Descendente da família Alencar — o ciclo histórico se fecha: da Bárbara de Alencar (1760) ao Frei Tito (1945), a mesma família lutou pela liberdade por dois séculos.\",\"knowsAbout\":\"Religioso/Social\"}},{\"@type\":\"ListItem\",\"position\":27,\"item\":{\"@type\":\"Person\",\"name\":\"Belchior\",\"alternateName\":\"Antônio Carlos Gomes Belchior\",\"birthPlace\":\"Sobral (CE)\",\"deathPlace\":\"Santa Cruz do Sul (RS)\",\"description\":\"O poeta da juventude desiludida. Sua obra é referência sobre identidade, rebeldia e nordestinidade na MPB.\",\"knowsAbout\":\"Musical\"}},{\"@type\":\"ListItem\",\"position\":28,\"item\":{\"@type\":\"Person\",\"name\":\"Fagner\",\"alternateName\":\"Raimundo Fagner Cândido Lopes\",\"birthPlace\":\"Orós (CE)\",\"deathPlace\":\"—\",\"description\":\"Um dos maiores intérpretes da MPB. Guardião da identidade musical cearense no cenário nacional por mais de cinco décadas.\",\"knowsAbout\":\"Musical\"}},{\"@type\":\"ListItem\",\"position\":29,\"item\":{\"@type\":\"Person\",\"name\":\"Ednardo\",\"alternateName\":\"José Ednardo Soares Costa Sousa\",\"birthPlace\":\"Fortaleza (CE)\",\"deathPlace\":\"—\",\"description\":\"Fundador do movimento musical que levou a identidade cearense ao centro da MPB nacional.\",\"knowsAbout\":\"Musical\"}},{\"@type\":\"ListItem\",\"position\":30,\"item\":{\"@type\":\"Person\",\"name\":\"Chico Anysio\",\"alternateName\":\"Francisco Anysio de Oliveira Paula Filho\",\"birthPlace\":\"Maranguape (CE)\",\"deathPlace\":\"Rio de Janeiro (RJ)\",\"description\":\"O maior comediante da história da TV brasileira. A criação de 209 personagens é recorde nacional documentado pelo RankBrasil.\",\"knowsAbout\":\"Teatro/Cultural\"}},{\"@type\":\"ListItem\",\"position\":31,\"item\":{\"@type\":\"Person\",\"name\":\"Oswald Barroso\",\"alternateName\":\"O Mestre do Teatro Popular Cearense\",\"birthPlace\":\"Fortaleza (CE)\",\"deathPlace\":\"Fortaleza (CE)\",\"description\":\"Referência do teatro popular nordestino. Suas obras são base obrigatória dos estudos de cultura popular e afro-brasileira no Ceará.\",\"knowsAbout\":\"Teatro/Cultural\"}}]}"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"VCY6R9k-XfWt8ypyQNPxV\",\"p\":\"\",\"c\":[\"\",\"heroisdoceara\"],\"i\":false,\"f\":[[[\"\",{\"children\":[\"heroisdoceara\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],[\"\",[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/cf90c36e81131637.css\",\"precedence\":\"next\",\"crossOrigin\":\"$und
